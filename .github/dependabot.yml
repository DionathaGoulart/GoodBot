# Atualizações semanais de dependência (PRD §11). Só duas ecologias importam
# aqui: o npm do monorepo e as actions da própria CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits em inglês, como o resto do histórico (CLAUDE.md).
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Um PR por grupo em vez de um por pacote: o repositório é pequeno e a
      # CI roda o monorepo inteiro a cada PR.
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Um PR por action virava cinco PRs numa segunda-feira, e nenhum deles
      # é testado por um PR: o `ci.yml` não usa as actions do docker e o
      # `deploy.yml` só roda em push na `main`. Num PR só, o review é uma
      # leitura de diff e o primeiro deploy depois do merge valida o conjunto.
      acoes:
        patterns: ['*']
