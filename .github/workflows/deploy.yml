# Deploy — só na `main`. Quatro jobs, todos depois das migrations: migrations
# no Postgres gerenciado, build da imagem amd64 do bot no GHCR, `docker compose
# pull` por SSH na VM da Oracle e a publicação do painel na Vercel (PRD §7.5).
#
# O painel entrou aqui na v1.4. Antes ele saía pela integração git da Vercel,
# **em paralelo** com este workflow, e isso tinha uma janela ruim: num push que
# mexe no schema, a Vercel publicava o painel novo enquanto o job `migrate`
# ainda rodava, e o código novo falava com o banco velho. Erro de enum ou de
# coluna inexistente em toda tela logada, até a migration terminar.
#
# Por isso `apps/web/vercel.json` traz `git.deploymentEnabled.main = false`: na
# `main` quem publica é o job `painel` daqui, e só depois do `migrate`. Branch
# e PR continuam ganhando preview pela integração normal.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys nunca se cancelam no meio: um `up -d` interrompido deixa a VM em
# estado indefinido. A execução seguinte espera a anterior terminar.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: goodbot-bot

jobs:
  # 1. Migrations antes de tudo: se o schema não subir, nada mais sobe.
  migrate:
    name: Migrations (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --filter @goodbot/db...

      - name: Aplicar migrations
        # Conexão direta (5432) com `?sslmode=require`, nunca o pooler.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

  # 2. O painel. Depende só do `migrate`: pode subir em paralelo com a imagem
  #    do bot, desde que o schema já esteja no lugar.
  painel:
    name: Painel (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: migrate
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Tudo daqui roda na **raiz do repositório**, não em `apps/web`. O projeto
      # da Vercel já tem `apps/web` como Root Directory, e a CLI soma esse
      # caminho ao diretório atual: rodando de dentro de `apps/web` ela procura
      # `apps/web/apps/web` e falha na publicação.
      #
      # `pull` traz as variáveis de ambiente de produção do projeto. Elas nunca
      # entram no repositório: o cofre da Vercel continua sendo o da Vercel.
      - name: Puxar a configuração do projeto
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      # `--prebuilt`: sobe o que este runner já compilou, em vez de mandar a
      # Vercel compilar de novo.
      - name: Publicar
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  # 3. Imagem linux/amd64 no GHCR. O runner já é x86: sem QEMU.
  build:
    name: Imagem do bot (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: migrate
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Owner em minúsculas
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags e labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/bot.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. A VM só puxa a imagem: nada é compilado no free tier.
  deploy:
    name: Deploy na Oracle (SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v7

      # O `docker compose up` da VM lê o compose do disco DELA, não o do
      # repositório. Sem este passo, mudança em `infra/` nunca chegava lá: o
      # bootstrap copiava uma vez, na instalação, e nada depois.
      - name: Enviar infra para a VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: infra/docker-compose.yml,infra/Caddyfile,infra/fail2ban/*,infra/scripts/*.sh
          target: /tmp/goodbot-infra
          strip_components: 1
          overwrite: true

      - name: docker compose pull && up -d
        uses: appleboy/ssh-action@v1
        env:
          # O pacote no GHCR é privado. O token do job dura só o job: a VM
          # autentica, puxa e desloga, sem PAT parado no disco de lá.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # URL pública do painel — não é segredo, por isso `vars` e não
          # `secrets`. O bot lê dela um endereço só: o link do convite que ele
          # manda quando a demo acaba. Vazia = o passo abaixo não faz nada e o
          # `.env` da VM continua mandando.
          AUTH_URL: ${{ vars.AUTH_URL }}
          # Quem abre o painel admin. Também não é segredo — é um ID público do
          # Discord —, e o bot o usa para conferir o `actorId` de toda escrita
          # em `/admin`. Vazia = as rotas admin recusam tudo.
          OWNER_DISCORD_ID: ${{ vars.OWNER_DISCORD_ID }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,AUTH_URL,OWNER_DISCORD_ID
          script_stop: true
          script: |
            bash /tmp/goodbot-infra/scripts/migrate-rename.sh
            cd /opt/goodbot
            # As variáveis não-secretas no `.env` da VM, sem ninguém precisar
            # de SSH. Só escreve as que existem no repositório: um valor vazio
            # apagaria silenciosamente o que já está lá, e o `.env` é o cofre da
            # máquina — o CI só encosta nestas linhas.
            #
            # Cria com 600 quando não existe; arquivo que já existe não tem a
            # permissão mexida.
            [ -f .env ] || install -m 600 /dev/null .env
            set_env() {
              [ -n "$2" ] || return 0
              if grep -q "^$1=" .env; then
                sed -i "s|^$1=.*|$1=$2|" .env
              else
                echo "$1=$2" >> .env
              fi
            }
            set_env AUTH_URL "${AUTH_URL:-}"
            set_env OWNER_DISCORD_ID "${OWNER_DISCORD_ID:-}"
            install -m 640 /tmp/goodbot-infra/docker-compose.yml ./docker-compose.yml
            # 644, e não 640 como o compose: o Caddyfile é montado DENTRO do
            # container, que roda com `cap_drop: ALL`. Sem CAP_DAC_OVERRIDE o
            # root de lá não fura permissão, e um arquivo sem o bit de leitura
            # para "outros" é ilegível para ele — o Caddy sai com 1 e entra em
            # loop de restart, derrubando a API inteira. Não há segredo aqui:
            # domínio e e-mail do ACME chegam por variável de ambiente.
            install -m 644 /tmp/goodbot-infra/Caddyfile ./Caddyfile
            install -d -m 750 ./scripts
            install -m 755 /tmp/goodbot-infra/scripts/backup.sh ./scripts/backup.sh
            install -m 755 /tmp/goodbot-infra/scripts/restore.sh ./scripts/restore.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
            rm -rf /tmp/goodbot-infra
            docker compose ps
