# Deploy — só na `main`. Três jobs encadeados: migrations no Postgres
# gerenciado, build da imagem amd64 do bot no GHCR e `docker compose pull` por
# SSH na VM da Oracle (PRD §7.5).
#
# O painel NÃO está aqui: a Vercel publica sozinha pela integração git, em
# paralelo com este workflow.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys nunca se cancelam no meio: um `up -d` interrompido deixa a VM em
# estado indefinido. A execução seguinte espera a anterior terminar.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: cobot-bot

jobs:
  # 1. Migrations antes de tudo: se o schema não subir, nada mais sobe.
  migrate:
    name: Migrations (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --filter @cobot/db...

      - name: Aplicar migrations
        # Conexão direta (5432) com `?sslmode=require`, nunca o pooler.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

  # 2. Imagem linux/amd64 no GHCR. O runner já é x86: sem QEMU.
  build:
    name: Imagem do bot (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: migrate
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Owner em minúsculas
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags e labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/bot.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. A VM só puxa a imagem: nada é compilado no free tier.
  deploy:
    name: Deploy na Oracle (SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment: production
    steps:
      - name: docker compose pull && up -d
        uses: appleboy/ssh-action@v1
        env:
          # O pacote no GHCR é privado. O token do job dura só o job: a VM
          # autentica, puxa e desloga, sem PAT parado no disco de lá.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            cd /opt/cobot
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
            docker compose ps
