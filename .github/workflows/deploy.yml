# Deploy — só na `main`. Três jobs encadeados: migrations no Postgres
# gerenciado, build da imagem amd64 do bot no GHCR e `docker compose pull` por
# SSH na VM da Oracle (PRD §7.5).
#
# O painel NÃO está aqui: a Vercel publica sozinha pela integração git, em
# paralelo com este workflow.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys nunca se cancelam no meio: um `up -d` interrompido deixa a VM em
# estado indefinido. A execução seguinte espera a anterior terminar.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: goodbot-bot

jobs:
  # 1. Migrations antes de tudo: se o schema não subir, nada mais sobe.
  migrate:
    name: Migrations (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --filter @goodbot/db...

      - name: Aplicar migrations
        # Conexão direta (5432) com `?sslmode=require`, nunca o pooler.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

  # 2. Imagem linux/amd64 no GHCR. O runner já é x86: sem QEMU.
  build:
    name: Imagem do bot (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: migrate
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Owner em minúsculas
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags e labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/bot.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. A VM só puxa a imagem: nada é compilado no free tier.
  deploy:
    name: Deploy na Oracle (SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v7

      # O `docker compose up` da VM lê o compose do disco DELA, não o do
      # repositório. Sem este passo, mudança em `infra/` nunca chegava lá: o
      # bootstrap copiava uma vez, na instalação, e nada depois.
      - name: Enviar infra para a VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: infra/docker-compose.yml,infra/Caddyfile,infra/fail2ban/*,infra/scripts/*.sh
          target: /tmp/goodbot-infra
          strip_components: 1
          overwrite: true

      - name: docker compose pull && up -d
        uses: appleboy/ssh-action@v1
        env:
          # O pacote no GHCR é privado. O token do job dura só o job: a VM
          # autentica, puxa e desloga, sem PAT parado no disco de lá.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # URL pública do painel — não é segredo, por isso `vars` e não
          # `secrets`. O bot lê dela um endereço só: o link do convite que ele
          # manda quando a demo acaba. Vazia = o passo abaixo não faz nada e o
          # `.env` da VM continua mandando.
          AUTH_URL: ${{ vars.AUTH_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,AUTH_URL
          script_stop: true
          script: |
            bash /tmp/goodbot-infra/scripts/migrate-rename.sh
            cd /opt/goodbot
            # `AUTH_URL` no `.env` da VM, sem ninguém precisar de SSH. Só
            # escreve quando a variável existe no repositório: um valor vazio
            # apagaria silenciosamente o que já está lá, e o `.env` é o cofre
            # da máquina — o CI só encosta nesta linha.
            if [ -n "${AUTH_URL:-}" ]; then
              # Cria com 600 quando não existe; arquivo que já existe não tem
              # a permissão mexida.
              [ -f .env ] || install -m 600 /dev/null .env
              if grep -q '^AUTH_URL=' .env; then
                sed -i "s|^AUTH_URL=.*|AUTH_URL=$AUTH_URL|" .env
              else
                echo "AUTH_URL=$AUTH_URL" >> .env
              fi
            fi
            install -m 640 /tmp/goodbot-infra/docker-compose.yml ./docker-compose.yml
            install -m 640 /tmp/goodbot-infra/Caddyfile ./Caddyfile
            install -d -m 750 ./scripts
            install -m 755 /tmp/goodbot-infra/scripts/backup.sh ./scripts/backup.sh
            install -m 755 /tmp/goodbot-infra/scripts/restore.sh ./scripts/restore.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
            rm -rf /tmp/goodbot-infra
            docker compose ps
