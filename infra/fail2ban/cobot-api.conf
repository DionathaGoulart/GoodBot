# Filtro do fail2ban para a API do bot (PRD §11).
#
# A fonte é o log do **Caddy** (JSON, via `docker logs`), e não o do bot: o
# Caddy é quem enxerga o IP de verdade, e o log dele já sai estruturado.
# Casa qualquer resposta 401 do reverse proxy — que só acontece quando alguém
# manda um Bearer errado, porque o painel manda o certo.
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"status":401.*$
ignoreregex =
datepattern = "ts":{EPOCH}
