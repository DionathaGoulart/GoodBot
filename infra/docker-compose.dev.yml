# Somente o Postgres para desenvolvimento local.
# Uso: docker compose -f infra/docker-compose.dev.yml up -d
name: goodbot-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: goodbot-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: goodbot
      POSTGRES_PASSWORD: goodbot
      POSTGRES_DB: goodbot
      TZ: America/Sao_Paulo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - goodbot-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U goodbot -d goodbot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  goodbot-dev-pgdata:
