# Somente o Postgres para desenvolvimento local.
# Uso: docker compose -f infra/docker-compose.dev.yml up -d
name: cobot-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: cobot-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cobot
      POSTGRES_PASSWORD: cobot
      POSTGRES_DB: cobot
      TZ: America/Sao_Paulo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - cobot-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cobot -d cobot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cobot-dev-pgdata:
