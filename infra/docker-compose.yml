# Produção — VM Oracle E2.1.Micro (x86_64, 1 OCPU / 1 GB).
# Só o bot e o Caddy rodam aqui: o painel está na Vercel e o Postgres no
# Supabase (PRD §7.2, §7.5).
#
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
name: goodbot

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  bot:
    # A imagem é construída pela CI e publicada no GHCR (Etapa 19); a VM só faz
    # `pull`. `TAG` fixa um sha específico para rollback:
    #   TAG=sha-1a2b3c4 docker compose ... up -d
    # Para rodar a imagem local (`pnpm docker:build`), sobrescreva as duas:
    #   BOT_IMAGE=goodbot-bot TAG=local
    image: ${BOT_IMAGE:-ghcr.io/dionathagoulart/goodbot-bot}:${TAG:-latest}
    container_name: goodbot-bot
    platform: linux/amd64
    # Sem `build:` de propósito: se o pull falhar (credencial do GHCR, por
    # exemplo), o compose cairia em build local e o deploy passaria sem trocar
    # a imagem. Para construir na mão use `pnpm docker:build`.
    restart: unless-stopped
    # Duas origens possíveis, ambas opcionais: `../.env` é a raiz do monorepo
    # (rodando do repositório) e `./.env` é `/opt/goodbot/.env` na VM, onde só o
    # compose e o Caddyfile são copiados.
    env_file:
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      INTERNAL_API_PORT: 3001
      # O bot lê o volume de backups só para reportar o último dump no
      # `/health` (card "Saúde" do painel).
      BACKUP_DIR: /backups
    # Sem `ports`: a API só é alcançável pelo Caddy, pela rede interna
    # do Compose (PRD §7.3).
    expose:
      - '3001'
    networks: [goodbot]
    volumes:
      - backups:/backups:ro
    mem_limit: 384m
    mem_reservation: 256m
    pids_limit: 256
    # Sistema de arquivos imutável: o bot não escreve em disco (logs vão para
    # o stdout e os dados para o Postgres). `/tmp` existe porque o Node pode
    # querer escrever nele.
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: goodbot-caddy
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_started
    environment:
      # Em produção: bot.seu-dominio. Local: `localhost` (certificado interno).
      BOT_DOMAIN: ${BOT_DOMAIN:-localhost}
      # Sem isto o Caddyfile cai no fallback `admin@example.invalid`, e o
      # Let's Encrypt recusa a conta: "invalid domain ... public suffix".
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [goodbot]
    mem_limit: 64m
    # O Caddy **não** é read_only: ele grava certificados em /data.
    # `NET_BIND_SERVICE` é o que sobra do `cap_drop: ALL` para ouvir em 80/443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 30s
      timeout: 5s
      retries: 3

  # `pg_dump` diário contra o Supabase (PRD §11). O backup gerenciado do free
  # tier não é exportável — este é.
  backup:
    image: postgres:16-alpine
    container_name: goodbot-backup
    restart: unless-stopped
    # Sem `env_file`: este container não tem por que enxergar o DISCORD_TOKEN
    # nem o INTERNAL_API_TOKEN. Só o que ele usa, vindo da substituição do
    # Compose (que lê o `.env` do diretório do arquivo).
    environment:
      # Sem valor o `backup.sh` sai com erro explicando; usar `:?` aqui
      # quebraria até um `docker compose config` rodado da raiz do repo.
      DATABASE_URL: ${DATABASE_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      BACKUP_DIR: /backups
      # Hora (UTC) do dump: 06:00Z = 03:00 em São Paulo, longe do pico.
      BACKUP_HOUR: ${BACKUP_HOUR:-6}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    # Sem crond na imagem: o laço acorda de hora em hora e roda uma vez por dia.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          if [ "$$(date -u +%H)" = "$$(printf '%02d' "$$BACKUP_HOUR")" ] && [ "$$LAST" != "$$(date -u +%F)" ]; then
            LAST=$$(date -u +%F)
            sh /usr/local/bin/backup.sh || true
          fi
          sleep 900
        done
    networks: [goodbot]
    mem_limit: 128m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  goodbot:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  backups:
