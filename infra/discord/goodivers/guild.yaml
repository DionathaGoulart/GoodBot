categories:
  - name: Quartel-General
    channels:
      - name: bem-vindos
        topic: Aviso automático de quem chega e de quem impulsiona o servidor.
        overrides:
          - role: Bots
            view: allow
            send: allow
          - role: Almirante
            send: allow
          - role: "@everyone"
            view: allow
            send: deny
      - name: protocolos
        topic: As regras do servidor. Leia antes de tudo.
        overrides:
          - role: Bots
            view: allow
            send: allow
          - role: Almirante
            send: allow
          - role: "@everyone"
            view: allow
            send: deny
      - name: recrutas
        topic: Recém-chegado? Diga oi e tire suas dúvidas por aqui.
        slowmode: 5
        overrides:
          - role: "@everyone"
            view: allow
            send: allow
      - name: files
        topic: Downloads das ferramentas do Goodivers, como a Macro HD2 e o GoodVoice. Aparece pra quem tem o cargo Files.
        overrides:
          - role: Files
            view: allow
          - role: Bots
            view: allow
            send: allow
          - role: Youtube
            send: deny
          - role: Helldiver
            send: deny
          - role: Almirante
            view: allow
            send: allow
          - role: "@everyone"
            view: deny
            send: deny
  - name: Super Terra
    overrides:
      - role: "@everyone"
        view: deny
        send: deny
      - role: Bots
        view: allow
        send: allow
      - role: Almirante
        view: allow
        send: allow
      - role: Boletins
        view: allow
    channels:
