        type: announcement
        topic: Vídeos e lives novos do canal Goodivers, postados automaticamente pelo bot.
        overrides:
          - role: Boletins
            view: allow
          - role: Bots
            view: allow
            send: allow
          - role: Vídeos
            view: allow
          - role: Almirante
            view: allow
            send: allow
          - role: Lives
            view: allow
          - role: "@everyone"
            view: deny
            send: deny
      - name: patch-notes
        topic: Notas de atualização oficiais do Helldivers 2, trazidas do Discord oficial do jogo.
        overrides:
          - role: Boletins
            view: allow
          - role: Bots
            view: allow
            send: allow
          - role: Almirante
            view: allow
            send: allow
          - role: "@everyone"
            view: deny
            send: deny
      - name: ordens-superiores
        topic: Ordens Superiores (Major Orders) da guerra galáctica, trazidas do Discord oficial do jogo.
        overrides:
          - role: "@everyone"
            view: deny
            send: deny
          - role: Bots
            view: allow
            send: allow
          - role: Almirante
            view: allow
            send: allow
          - role: Boletins
            view: allow
      - name: comunicados-oficiais
        topic: "Anúncios oficiais do Helldivers 2: novidades, roadmap, eventos e pesquisas."
        overrides:
          - role: "@everyone"
            view: deny
            send: deny
          - role: Bots
            view: allow
            send: allow
          - role: Almirante
            view: allow
            send: allow
          - role: Boletins
            view: allow
