  # Cargos do módulo Buscar squad (PRD §5.11): o bot só liga e desliga, nunca
  # cria. Nenhum dá permissão, e os dois ficam abaixo do cargo do bot.
  - name: Buscando Squad
    color: "#e67e22"
    hoist: true
  - name: Sem Aviso de Squad
categories:
  - name: Início
    channels:
      - name: bem-vindos
        topic: Aviso automático de quem chega e de quem impulsiona o servidor.
        overrides:
          - role: Bots
            view: allow
            send: allow
          - role: Almirante
            send: allow
          - role: "@everyone"
            view: allow
            send: deny
      - name: protocolos
        topic: As regras do servidor. Leia antes de tudo.
        overrides:
          - role: Bots
            view: allow
            send: allow
          - role: Almirante
            send: allow
          - role: "@everyone"
            view: allow
            send: deny
      - name: recrutas
        topic: Recém-chegado? Apresente-se, diga oi e tire suas dúvidas por aqui.
        slowmode: 5
        overrides:
          - role: "@everyone"
            view: allow
            send: allow
      # O fórum `files` (downloads) mora logo depois; fórum não entra no spec.
      - name: files-old
        topic: Downloads das ferramentas do Goodivers, como a Macro HD2 e o GoodVoice. Aparece pra quem tem o cargo Files.
        overrides:
          - role: Bots
            view: allow
            send: allow
          - role: Youtube
            send: deny
          - role: Helldiver
            send: deny
          - role: Almirante
            view: allow
            send: allow
          - role: "@everyone"
            view: deny
            send: deny
  - name: Avisos do Jogo
    overrides:
      - role: "@everyone"
        view: deny
        send: deny
      - role: Bots
        view: allow
        send: allow
      - role: Almirante
        view: allow
        send: allow
      - role: Boletins
        view: allow
    channels:
      - name: transmissões
        type: announcement
        topic: Vídeos e lives novos do canal Goodivers, postados automaticamente pelo bot.
        overrides:
          - role: Boletins
            view: allow
          - role: Bots
            view: allow
            send: allow
          - role: Vídeos
            view: allow
          - role: Almirante
            view: allow
            send: allow
          - role: Lives
            view: allow
          - role: "@everyone"
            view: deny
            send: deny
      - name: patch-notes
        topic: Notas de atualização oficiais do Helldivers 2, trazidas do Discord oficial do jogo.
        overrides:
          - role: Boletins
            view: allow
          - role: Bots
            view: allow
            send: allow
          - role: Almirante
            view: allow
            send: allow
          - role: "@everyone"
            view: deny
            send: deny
      - name: ordens-superiores
        topic: Ordens Superiores (Major Orders) da guerra galáctica, trazidas do Discord oficial do jogo.
        overrides:
          - role: "@everyone"
            view: deny
            send: deny
          - role: Bots
            view: allow
            send: allow
          - role: Almirante
            view: allow
            send: allow
          - role: Boletins
            view: allow
      - name: comunicados-oficiais
        topic: "Anúncios oficiais do Helldivers 2: novidades, roadmap, eventos e pesquisas."
        overrides:
          - role: "@everyone"
            view: deny
            send: deny
          - role: Bots
            view: allow
            send: allow
          - role: Almirante
            view: allow
            send: allow
          - role: Boletins
            view: allow
  - name: Canal Goodivers
  - name: Comunidade
    channels:
      - name: Zona de Combate¹
        type: voice
      - name: sala-de-comando
        topic: "Papo geral sobre Helldivers 2: estratégias, builds, dúvidas e novidades."
        overrides:
          - role: "@everyone"
            view: allow
      - name: Zona de Combate²
        type: voice
      - name: off-topic
        topic: Conversa livre sobre qualquer assunto fora do Helldivers 2.
        overrides:
          - role: "@everyone"
            view: allow
      - name: Comando Secreto
        type: voice
        overrides:
          - role: Almirante
            view: allow
          - role: "@everyone"
            view: deny
      - name: clipes-e-prints
        topic: Seus melhores clipes e prints do jogo. Divulgar canal ou live só vale aqui.
        slowmode: 30
        overrides:
          - role: "@everyone"
            view: allow
      - name: Criogenia
        type: voice
  # A categoria é do módulo Buscar squad (PRD §5.11): as salas `Squad <nome
  # grego>` nascem e somem pelo bot e não entram aqui. Não crie canal de voz
  # com esse formato de nome nesta categoria, ele seria apagado ao esvaziar.
  - name: Buscar Squad
    channels:
      - name: buscar-squad
        topic: Aqui só o Goodbot escreve. Quer jogar agora? Clique em BUSCAR SQUAD na mensagem fixada ou entre no ➕ Criar Squad.
        overrides:
          - role: "@everyone"
            view: allow
            send: deny
      # Agenda do Buscar squad: cada jogatina é uma mensagem do bot com uma
      # thread. O `send: deny` só nega Enviar mensagens; responder na thread
      # continua liberado pelo cargo.
      - name: agenda
        topic: Jogatinas marcadas. Clique em MARCAR JOGATINA no #buscar-squad; aqui é só VOU, SAIR ou PEDIR VAGA, e a conversa vai na thread de cada uma.
        overrides:
          - role: "@everyone"
            view: allow
            send: deny
      - name: ➕ Criar Squad
        type: voice
  - name: Suporte
    overrides:
      - role: "@everyone"
        view: deny
      - role: Almirante
        view: allow
        send: allow
    channels:
      - name: abrir-ticket
        topic: Precisa falar com a staff? Clique no botão abaixo e um canal privado é aberto só pra você.
        overrides:
          - role: "@everyone"
            view: allow
            send: deny
          - role: Almirante
            view: allow
            send: allow
